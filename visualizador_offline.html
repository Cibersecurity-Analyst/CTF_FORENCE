      font-weight: 600;
      margin-bottom: 0.5rem;

      font-weight: 700;
      color: #ecc94b;
    }

      border: 1px solid #4a5568;
      border-radius: 10px;
      color: #e2e8f0;
    }
    .modal-header {
      border-bottom: 1px solid #2d3748;
    }
    .modal-footer {
      border-top: 1px solid #2d3748;
    }

      color: #fff;
      border-radius: 6px;

      display: inline-block;

  function getSolves() {
    try {
      return JSON.parse(localStorage.getItem('ctf_offline_solves') || '[]');
    } catch(e) {
      return [];
    }
  }

  function saveSolve(id) {
    const solves = getSolves();
    if (!solves.includes(id)) {
      solves.push(id);
      localStorage.setItem('ctf_offline_solves', JSON.stringify(solves));
    }
    renderBoard();
  }

  function resetSolves() {
    if (confirm("¿Deseas reiniciar todos los retos a no resueltos?")) {
      localStorage.removeItem('ctf_offline_solves');
      renderBoard();
    }
  }

  let currentCh = null;
  let modalInstance = null;

  function renderBoard() {
    const solves = getSolves();
    const board = document.getElementById('board');
    board.innerHTML = '';

    // Group by category
    const categories = {};
    challenges.forEach(c => {
      if (!categories[c.category]) categories[c.category] = [];
      categories[c.category].push(c);
    });

    for (const [catName, chList] of Object.entries(categories)) {
      const catDiv = document.createElement('div');
      catDiv.className = 'mb-5';

      const catHeader = document.createElement('div');
      catHeader.className = 'category-header';
      catHeader.innerHTML = `<h3>${catName}</h3>`;
      catDiv.appendChild(catHeader);

      const row = document.createElement('div');
      row.className = 'row g-3';

      chList.forEach(ch => {
        const col = document.createElement('div');
        col.className = 'col-sm-6 col-md-4 col-lg-3';

        const isSolved = solves.includes(ch.id);
        const btn = document.createElement('button');
        btn.className = 'challenge-button ' + (isSolved ? 'challenge-solved' : '');
        btn.onclick = () => openChallenge(ch.id);

        btn.innerHTML = `
          <div class="challenge-name">${ch.name}</div>
          <div class="challenge-value">${ch.value} pts</div>
        `;

        col.appendChild(btn);
        row.appendChild(col);
      });

      catDiv.appendChild(row);
      board.appendChild(catDiv);
    }
  }

  function openChallenge(id) {
    currentCh = challenges.find(c => c.id === id);
    if (!currentCh) return;

    document.getElementById('modalTitle').textContent = currentCh.name;
    document.getElementById('modalCategory').textContent = currentCh.category;
    document.getElementById('modalPoints').textContent = currentCh.value + ' Puntos';
    document.getElementById('modalDesc').textContent = currentCh.description;

    const filesDiv = document.getElementById('modalFiles');
    filesDiv.innerHTML = '';
    if (currentCh.files && currentCh.files.length > 0) {
      currentCh.files.forEach(f => {
        const fname = f.split('/').pop();
        const a = document.createElement('a');
        a.className = 'file-btn';
        a.href = f.replace(/^\//, '');
        a.download = fname;
        a.innerHTML = `💾 Descargar Archivo: <strong>${fname}</strong>`;
        filesDiv.appendChild(a);
      });
    }

    document.getElementById('flagInput').value = '';
    document.getElementById('alertBox').innerHTML = '';

    const modalEl = document.getElementById('challengeModal');
    modalInstance = new bootstrap.Modal(modalEl);
    modalInstance.show();
  }

  function submitFlag() {
    const input = document.getElementById('flagInput').value.trim();
    if (!input) {
      document.getElementById('alertBox').innerHTML = `
        <div class="alert alert-warning text-center mt-3">Por favor ingresa una respuesta o flag.</div>
      `;
      return;
    }

    saveSolve(currentCh.id);

    document.getElementById('alertBox').innerHTML = `
      <div class="alert alert-success text-center mt-3 animate__animated animate__fadeIn">
        <h5 class="fw-bold mb-1">¡Correcto!</h5>
        <div>Flag <code>${input}</code> aceptada. El reto se marcó como resuelto.</div>
      </div>
    `;
  }

  // Handle enter key
  document.addEventListener('DOMContentLoaded', () => {
    renderBoard();
    document.getElementById('flagInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitFlag();
    });
  });
</script>
